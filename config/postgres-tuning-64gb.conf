# ============================================================================
# PostgreSQL 16 Performance Tuning — 64 GB RAM / NVMe / Dedicated DB Host
# ----------------------------------------------------------------------------
# Reference configuration extracted from a production deployment.
# Adjust shared_buffers and effective_cache_size proportional to your host RAM.
# See docs/reference/POSTGRES_TUNING.md for the full deployment guide.
# ============================================================================


# Memory Settings
shared_buffers = 16GB                    # 25% von RAM
effective_cache_size = 48GB              # 75% von RAM
work_mem = 128MB                         # Pro Connection
maintenance_work_mem = 2GB               # Maintenance Operations

# Connection Settings
max_connections = 100                    # Maximale Connections

# NVMe SSD Optimierungen
random_page_cost = 1.1                   # NVMe optimiert
effective_io_concurrency = 200           # NVMe Performance

# Checkpoint Settings (für RAID 1 NVMe)
checkpoint_completion_target = 0.9
wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 4GB

# Query Planner
default_statistics_target = 100
